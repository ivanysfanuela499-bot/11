<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pong Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>PONG</h1>
            <div class="scoreboard">
                <div class="player-score">
                    <p class="label">PLAYER</p>
                    <p class="score" id="playerScore">0</p>
                </div>
                <div class="divider">:</div>
                <div class="computer-score">
                    <p class="label">COMPUTER</p>
                    <p class="score" id="computerScore">0</p>
                </div>
            </div>
        </div>
        
        <canvas id="pongCanvas" width="800" height="400"></canvas>
        
        <div class="controls">
            <p><strong>Controls:</strong></p>
            <p>🖱️ Move Mouse: Control paddle vertically</p>
            <p>⬆️ ⬇️ Arrow Keys: Control paddle vertically</p>
            <p>SPACE: Restart game</p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
